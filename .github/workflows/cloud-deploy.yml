name: Cloud Deploy (Supabase)

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-deploy
  cancel-in-progress: false

jobs:
  # The `secrets` context is not available in job-level `if:` expressions,
  # so a first job probes for them (via env, never echoed) and exports a flag.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.probe.outputs.has-secrets }}
    steps:
      - id: probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets absent; skipping cloud deploy (expected on forks)."
          fi

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        run: |
          supabase functions deploy create-checkout --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy billing-portal --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy report-savings --project-ref "$SUPABASE_PROJECT_REF"
          # Stripe authenticates via webhook signature, not a Supabase JWT:
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
