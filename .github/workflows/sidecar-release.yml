name: Sidecar Release

on:
  push:
    tags:
      - "sidecar-v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          # Future targets — enable as packaging/sidecar/build.sh grows support:
          # - os: macos-13
          #   target: macos-x64
          # - os: windows-2022
          #   target: windows-x64
          # - os: ubuntu-22.04
          #   target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # build.sh hardcodes its venv at packaging/sidecar/.venv
        run: |
          python -m venv packaging/sidecar/.venv
          source packaging/sidecar/.venv/bin/activate
          python -m pip install --upgrade pip
          pip install "headroom-ai[proxy]" pyinstaller

      - name: Build sidecar (${{ matrix.target }})
        run: bash packaging/sidecar/build.sh
        env:
          SIDECAR_TARGET: ${{ matrix.target }}

      - name: Checksums
        # build.sh writes its artifacts to packaging/sidecar/dist
        run: |
          cd packaging/sidecar/dist
          for f in *.tar.gz; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          cat ./*.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/sidecar/dist/*.tar.gz
            packaging/sidecar/dist/*.tar.gz.sha256
          generate_release_notes: true
