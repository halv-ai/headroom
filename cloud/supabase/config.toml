# Supabase CLI configuration for Headroom Desktop cloud backend.
# Minimal, deploy-ready config. `project_id` is a local placeholder; the real
# project ref is bound with `supabase link --project-ref <ref>`.

project_id = "headroom-desktop"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

# Stripe calls this endpoint directly; it authenticates via webhook signature,
# not a Supabase JWT. Deploy with `--no-verify-jwt` (this setting covers
# local serve; the flag covers hosted deploys on older CLI versions).
[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.report-savings]
verify_jwt = true
